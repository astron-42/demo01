  <body>
    <div id="app">
      <!-- Three.js 画布挂载点 -->
      <canvas id="gl"></canvas>

      <!-- ================= 开始界面 ================= -->
      <div id="start-screen" class="overlay">
        <div class="panel">
          <h1 class="title">刹车距离挑战</h1>
          <p class="subtitle">精准制动</p>
          <ul class="rules">
            <li>你以 200 km/h 出发</li>
            <li>前方 165 米处固定设有路障，需精准控制刹车力度</li>
            <li>按住刹车踏板并 <b>上滑</b> 增大力度、<b>下滑</b> 减小力度</li>
            <li>力度 1–10，力度越大制动越猛、得分越高</li>
            <li>⚠️ 仅力度 8–10 有机会停住，坚持 10 力度超过 0.5 秒 → 制动损坏！</li>
          </ul>
          <button id="start-btn" class="btn primary">开始游戏</button>
        </div>
      </div>

      <!-- ================= 游戏 HUD ================= -->
      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="hud-box speed-box">
            <span id="speed-value">0</span><span class="unit">km/h</span>
          </div>
          <div class="hud-box status-box">
            <span id="status-value">行驶中</span>
          </div>
        </div>

        <div id="damage-warning" class="damage-warning hidden">
          制动系统损坏！力度锁定为 1
        </div>

        <!-- 底部刹车区：力度条 + 踏板 -->
        <div class="hud-bottom">
          <div class="force-gauge">
            <div class="force-label">力度</div>
            <div class="force-track">
              <div id="force-fill" class="force-fill"></div>
            </div>
            <div id="force-value" class="force-value">0</div>
          </div>
          <div id="brake-pedal" class="brake-pedal">
            <div class="pedal-base">
              <div class="pedal-plate">
                <div class="pedal-ridges">
                  <span></span><span></span><span></span><span></span>
                </div>
                <span class="pedal-label">BRAKE</span>
              </div>
            </div>
            <span class="pedal-hint">按住 ★ 上滑加力</span>
          </div>
        </div>
      </div>

      <!-- ================= 结算界面 ================= -->
      <div id="result-screen" class="overlay hidden">
        <div class="panel">
          <h2 id="result-title" class="result-title">成功</h2>
          <p id="result-sub" class="result-sub"></p>
          <div class="stats">
            <div class="stat-row"><span>初速</span><b id="stat-speed">-</b></div>
            <div class="stat-row"><span>行驶距离</span><b id="stat-travel">-</b></div>
            <div class="stat-row"><span>实际制动距离</span><b id="stat-actual">-</b></div>
            <div class="stat-row"><span>基础得分</span><b id="stat-base">-</b></div>
            <div class="stat-row highlight"><span>精准停车奖励</span><b id="stat-bonus">-</b></div>
            <div class="stat-row total"><span>最终得分</span><b id="stat-total">-</b></div>
          </div>
          <button id="restart-btn" class="btn primary">再来一次</button>
        </div>
      </div>
    </div>

  </body>
</html>
